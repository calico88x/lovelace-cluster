apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid # will wait if a previous job is still running
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:44.258.3
              imagePullPolicy: IfNotPresent
              args:
                - NovaLabs/lovelace-cluster

              envFrom:
                - secretRef:
                    name: renovate-container-env
                - secretRef:
                    name: renovate-github-env
                - configMapRef:
                    name: renovate-configmap
              env:
                - name: NODE_EXTRA_CA_CERTS
                  value: "/etc/forgejo-ca/ca.crt"

              volumeMounts:
                - name: forgejo-ca
                  mountPath: /etc/forgejo-ca
                  readOnly: true

          restartPolicy: Never

          volumes:
            - name: forgejo-ca
              configMap:
                name: forgejo-caddy-root-ca
