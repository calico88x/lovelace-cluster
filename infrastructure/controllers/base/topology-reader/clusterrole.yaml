apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novalabs-topology-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
    verbs:
      - list
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
