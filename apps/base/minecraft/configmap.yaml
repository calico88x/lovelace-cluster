apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-config
  namespace: minecraft
data:
  EULA: "TRUE"
  TYPE: PAPER
  VERSION: "26.2"
  MEMORY: 3G
  INIT_MEMORY: 1G
  ONLINE_MODE: "TRUE"
  ENABLE_STATUS: "TRUE"
  ENABLE_RCON: "FALSE"
  ENABLE_WHITELIST: "TRUE"
  ENFORCE_WHITELIST: "TRUE"
  EXISTING_WHITELIST_FILE: SYNCHRONIZE
  MAX_PLAYERS: "10"
  VIEW_DISTANCE: "8"
  SIMULATION_DISTANCE: "6"
  DIFFICULTY: normal
  MODE: survival
  PVP: "FALSE"
  MOTD: Minecraft Server
  TZ: America/Toronto
