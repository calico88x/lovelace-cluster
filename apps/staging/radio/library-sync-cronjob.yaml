apiVersion: batch/v1
kind: CronJob
metadata:
  name: radio-library-sync
  namespace: radio

spec:
  schedule: "*/5 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1

      template:
        metadata:
          labels:
            app: radio-library-sync

        spec:
          restartPolicy: Never

          containers:
            - name: sync
              image: alpine:3.22

              command:
                - /bin/sh
                - -ec

              args:
                - |
                  apk add --no-cache git git-lfs openssh-client

                  export GIT_SSH_COMMAND="ssh \
                    -i /ssh/id_ed25519 \
                    -o IdentitiesOnly=yes \
                    -o UserKnownHostsFile=/ssh/known_hosts \
                    -o StrictHostKeyChecking=yes"

                  ROOT="/library"
                  REPO="${ROOT}/repo"
                  RELEASES="${ROOT}/releases"
                  CURRENT="${ROOT}/current"

                  git lfs install --skip-repo

                  #
                  # Validate the persistent Git checkout.
                  #
                  if ! git -C "${REPO}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                    echo "ERROR: ${REPO} is not a valid Git checkout"
                    exit 1
                  fi

                  mkdir -p "${RELEASES}"

                  #
                  # Fetch the desired state from Forgejo.
                  #
                  git -C "${REPO}" fetch --prune origin main

                  TARGET_COMMIT="$(git -C "${REPO}" rev-parse origin/main)"
                  TARGET_RELEASE="${RELEASES}/${TARGET_COMMIT}"

                  #
                  # Record the release that was current before promotion.
                  # We retain this as one-generation rollback protection.
                  #
                  CURRENT_TARGET=""

                  if [ -L "${CURRENT}" ]; then
                    CURRENT_TARGET="$(readlink "${CURRENT}")"
                  fi

                  #
                  # Fast path: nothing changed.
                  #
                  if [ "${CURRENT_TARGET}" = "releases/${TARGET_COMMIT}" ] \
                    && [ -d "${TARGET_RELEASE}/music" ]; then
                    echo "Library already current at ${TARGET_COMMIT}"
                    exit 0
                  fi

                  echo "Preparing library commit ${TARGET_COMMIT}"

                  #
                  # Move the persistent checkout to the desired commit.
                  # Skip automatic LFS smudging so the LFS transfer is
                  # performed explicitly and can be validated afterward.
                  #
                  GIT_LFS_SKIP_SMUDGE=1 \
                    git -C "${REPO}" reset --hard "${TARGET_COMMIT}"

                  cd "${REPO}"
                  git lfs pull
                  git lfs fsck
                  cd /

                  #
                  # Construct a complete release in a temporary directory.
                  #
                  TMP_RELEASE="${RELEASES}/.${TARGET_COMMIT}.tmp"

                  rm -rf "${TMP_RELEASE}"
                  mkdir -p "${TMP_RELEASE}"

                  cp -a "${REPO}/music" "${TMP_RELEASE}/music"

                  if [ -d "${REPO}/idents" ]; then
                    cp -a "${REPO}/idents" "${TMP_RELEASE}/idents"
                  fi

                  if [ -d "${REPO}/specials" ]; then
                    cp -a "${REPO}/specials" "${TMP_RELEASE}/specials"
                  fi

                  #
                  # Validate that every tracked music file made it into
                  # the prepared release.
                  #
                  TRACKED_COUNT="$(
                    git -C "${REPO}" ls-files 'music/*' |
                    wc -l |
                    tr -d ' '
                  )"

                  RELEASE_COUNT="$(
                    find "${TMP_RELEASE}/music" -type f |
                    wc -l |
                    tr -d ' '
                  )"

                  echo "Tracked music files:   ${TRACKED_COUNT}"
                  echo "Published music files: ${RELEASE_COUNT}"

                  if [ "${TRACKED_COUNT}" -eq 0 ] \
                    || [ "${TRACKED_COUNT}" -ne "${RELEASE_COUNT}" ]; then
                    echo "ERROR: release validation failed"
                    exit 1
                  fi

                  #
                  # Promote the completed temporary release into the
                  # immutable releases directory.
                  #
                  if [ ! -d "${TARGET_RELEASE}" ]; then
                    mv "${TMP_RELEASE}" "${TARGET_RELEASE}"
                  else
                    rm -rf "${TMP_RELEASE}"
                  fi

                  #
                  # current must always be a symlink managed by this job.
                  #
                  if [ -e "${CURRENT}" ] && [ ! -L "${CURRENT}" ]; then
                    echo "ERROR: ${CURRENT} exists and is not a symlink"
                    exit 1
                  fi

                  NEXT_LINK="${ROOT}/.current.${TARGET_COMMIT}"

                  rm -f "${NEXT_LINK}"
                  ln -s "releases/${TARGET_COMMIT}" "${NEXT_LINK}"

                  #
                  # Atomic promotion.
                  #
                  # Liquidsoap sees either the complete previous release
                  # or the complete new release, never a partially copied
                  # directory.
                  #
                  mv -f "${NEXT_LINK}" "${CURRENT}"

                  #
                  # Retain:
                  #
                  #   1. the newly published/current release
                  #   2. the release that was current immediately before it
                  #
                  # Everything older is removed to prevent the radio disk
                  # from growing indefinitely.
                  #
                  PREVIOUS_RELEASE=""

                  case "${CURRENT_TARGET}" in
                    releases/*)
                      PREVIOUS_RELEASE="${ROOT}/${CURRENT_TARGET}"
                      ;;
                  esac

                  for RELEASE in "${RELEASES}"/*; do
                    [ -d "${RELEASE}" ] || continue

                    if [ "${RELEASE}" = "${TARGET_RELEASE}" ]; then
                      continue
                    fi

                    if [ -n "${PREVIOUS_RELEASE}" ] \
                      && [ "${RELEASE}" = "${PREVIOUS_RELEASE}" ]; then
                      continue
                    fi

                    echo "Pruning old release: ${RELEASE}"
                    rm -rf -- "${RELEASE}"
                  done

                  #
                  # Remove Git LFS objects that are no longer required by
                  # the checkout while retaining objects needed by HEAD.
                  #
                  cd "${REPO}"
                  git lfs prune
                  cd /

                  echo "Published radio library:"
                  echo "${TARGET_COMMIT}"
                  echo "Current -> $(readlink "${CURRENT}")"

              volumeMounts:
                - name: music
                  mountPath: /library

                - name: ssh
                  mountPath: /ssh
                  readOnly: true

          volumes:
            - name: music
              persistentVolumeClaim:
                claimName: radio-music

            - name: ssh
              secret:
                secretName: radio-library-ssh
                defaultMode: 0400
