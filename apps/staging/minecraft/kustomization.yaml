apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/minecraft
  - storageclass.yaml
  - persistentvolume.yaml
  - minecraft-private.sops.yaml
  - playit-secret.sops.yaml
  - alloy-logs.yaml
  - active-server.yaml

patches:
  - path: storage.patch.yaml
  - path: statefulset.patch.yaml
  - path: configmap.patch.yaml
  - path: create-anti-affinity.patch.yaml

# Paper is stopped while Create is active. The shared Playit agent is
# deliberately omitted and remains running.
replicas:
  - name: minecraft
    count: 0
  - name: alloy-minecraft-logs
    count: 0
