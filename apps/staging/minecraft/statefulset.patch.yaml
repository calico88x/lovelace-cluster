apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  template:
    spec:
      nodeSelector:
        workload: minecraft

      containers:
        - name: minecraft
          ports:
            - name: metrics
              containerPort: 9940
              hostPort: 9940
              protocol: TCP

          envFrom:
            - configMapRef:
                name: minecraft-config

            - secretRef:
                name: minecraft-private

          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 6Gi

        - name: network-exporter
          ports:
            - name: network-metrics
              containerPort: 9100
              hostPort: 9101
              protocol: TCP
