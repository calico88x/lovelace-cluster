apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/minecraft-create
  - storageclass.yaml
  - persistentvolume.yaml
  - minecraft-private.sops.yaml
  - alloy-logs.yaml

patches:
